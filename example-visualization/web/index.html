<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>example-visualization</title>
    <style>
        canvas {
            position: absolute;
            left: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: black;
        }
        body {
            margin: 0;
        }
    </style>
</head>
<body>

<canvas id="fgfx_canvas"></canvas>
<script src="backend.js"></script>
<script src="runtime-js-compiled.js"></script>
<script>
(async () => {
  window.Module = window.Module || {};
  if (window.FGFX_BACKEND_WEBGPU) {
    if (!navigator.gpu) {
      throw new Error('WebGPU is not available in this browser');
    }
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) {
      throw new Error('No WebGPU adapter');
    }
    window.Module.preinitializedWebGPUDevice = await adapter.requestDevice();
  }
  const script = document.createElement('script');
  script.src = 'example_visualization.js';
  script.type = 'application/javascript';
  document.body.appendChild(script);
})();
</script>

</body>
</html>
